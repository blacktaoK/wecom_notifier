    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --card:#161b22; --code:#1c2128; }
  }
  text { fill: var(--fg); }
  .m { fill: var(--muted); }
  .cd { fill: var(--card); stroke: var(--line); stroke-width:1; }
  .ln { stroke: var(--line); stroke-width:1; }
  .ac { stroke: url(#g2); stroke-width:2; fill:none; }
